<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mittelalter – Lobby</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh}
.panel{background:#121a2b;padding:30px;border-radius:12px;width:420px}
.quickNameGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.quickNameBtn{padding:12px;background:#1d4ed8;border:none;color:white;border-radius:6px;cursor:pointer}
.quickNameBtn.selected{background:#22c55e}
.colorGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.colorBtn{aspect-ratio:1;border-radius:50%;border:3px solid transparent;cursor:pointer}
.colorBtn[data-slot="0"]{background:#ef4444;}
.colorBtn[data-slot="1"]{background:#3b82f6;}
.colorBtn[data-slot="2"]{background:#22c55e;}
.colorBtn[data-slot="3"]{background:#facc15;}
.colorBtn.selected{border-color:white}
.colorBtn.locked{opacity:0.3;cursor:not-allowed}
button{width:100%;margin-top:10px;padding:12px;border:none;border-radius:6px;background:#2e7df6;color:white}
.startBtn{background:#22c55e}
</style>
</head>
<body>
<div class="panel">
<h1>Mittelalter Lobby</h1>
<div class="quickNameGrid">
<button class="quickNameBtn" onclick="selectName(this,'Christoph')">Christoph</button>
<button class="quickNameBtn" onclick="selectName(this,'Vanessa')">Vanessa</button>
<button class="quickNameBtn" onclick="selectName(this,'David')">David</button>
<button class="quickNameBtn" onclick="selectName(this,'Gast')">Gast</button>
</div>
<label>Farbe wählen</label>
<div class="colorGrid">
<div class="colorBtn" data-slot="0" onclick="selectColor(0)"></div>
<div class="colorBtn" data-slot="1" onclick="selectColor(1)"></div>
<div class="colorBtn" data-slot="2" onclick="selectColor(2)"></div>
<div class="colorBtn" data-slot="3" onclick="selectColor(3)"></div>
</div>
<input id="roomInput" placeholder="Raumcode">
<button onclick="createRoom()">Raum erstellen</button>
<button onclick="joinRoom()">Raum beitreten</button>
<div id="playerList"></div>
</div>

<script>
let selectedName=null;
let selectedColor=null;

function selectName(btn,name){
document.querySelectorAll('.quickNameBtn').forEach(b=>b.classList.remove('selected'));
btn.classList.add('selected');
selectedName=name;
}

function selectColor(slot){
const btn=document.querySelector(`.colorBtn[data-slot="${slot}"]`);
if(btn.classList.contains('locked')) return;
document.querySelectorAll('.colorBtn').forEach(b=>b.classList.remove('selected'));
btn.classList.add('selected');
selectedColor=slot;
}

function updateLockedColors(players){
document.querySelectorAll('.colorBtn').forEach(b=>b.classList.remove('locked'));
players.forEach(p=>{
const el=document.querySelector(`.colorBtn[data-slot="${p.color}"]`);
if(el) el.classList.add('locked');
});
}
</script>

<script src="mittelalter.online.js?v=11"></script>
</body>
</html>
